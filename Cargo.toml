[package]
name = "ogg-opus"
version = "0.1.3"
authors = ["sheosi <sertorbe@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A decoder/encoder for Ogg Opus"
repository = "https://github.com/sheosi/ogg-opus"

exclude = ["test_assets/*"] # Don't upload files for testing


[dependencies]
ogg = "^0.9.2"
audiopus = "^0.3.0-rc.0"
thiserror = "^2.0"
rand = { version = "^0.9", default-features = false, features = ["thread_rng"] }

[dev-dependencies]
wav = "^1.0"
